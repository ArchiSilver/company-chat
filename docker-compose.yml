version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=app
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  app:
    build: .
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=app
      - DB_PASSWORD=password
      - DB_NAME=app
      - SERVER_PORT=8080
      - JWT_SECRET=dev-secret
    depends_on:
      - db
    ports:
      - 8080:8080
    volumes:
      - ./uploads:/app/uploads

volumes:
  db-data:
